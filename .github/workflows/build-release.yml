name: Build and Release Baucher Match

on:
  push:
    branches:
      - feature/empaquetado-fullstack
  pull_request:
    branches:
      - feature/empaquetado-fullstack
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

env:
  PYTHON_VERSION: '3.9'
  NODE_VERSION: '20'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Python virtual environment
        shell: powershell
        run: |
          python -m venv .venv
          & .venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -r backend\requirements.txt
          pip install pyinstaller

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download and setup Poppler for Windows
        shell: powershell
        run: |
          # Descargar Poppler precompilado para Windows
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip"
          Invoke-WebRequest -Uri $url -OutFile poppler.zip
          Expand-Archive -Path poppler.zip -DestinationPath poppler
          
          # Crear directorio de librerías
          New-Item -ItemType Directory -Force -Path src-tauri\libs
          
          # Copiar todas las DLLs necesarias
          Copy-Item -Path "poppler\poppler-24.08.0\Library\bin\*.dll" -Destination "src-tauri\libs\" -Force
          
          # Verificar que las DLLs se copiaron
          Get-ChildItem src-tauri\libs\

      - name: Build backend
        shell: powershell
        run: |
          # Crear directorio de binarios
          New-Item -ItemType Directory -Force -Path "src-tauri\binaries"
          
          # Compilar con PyInstaller
          & ".venv\Scripts\pyinstaller.exe" --clean --onefile `
            --name backend-api-x86_64-pc-windows-msvc `
            --distpath "src-tauri\binaries" `
            "backend\backend.spec"
          
          Write-Host "✅ Backend compilado exitosamente" -ForegroundColor Green

      - name: Build Tauri app
        run: npm run tauri build

      - name: Rename artifacts
        shell: powershell
        run: |
          cd src-tauri\target\release\bundle\msi
          Get-ChildItem *.msi | Rename-Item -NewName { "baucher-match-windows-$($env:GITHUB_SHA.Substring(0,7)).msi" }

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: baucher-match-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baucher-match-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.ref_name }} - ${{ github.sha }}
          body: |
            ## 🚀 Baucher Match - Build Automático
            
            ### Branch: `${{ github.ref_name }}`
            ### Commit: `${{ github.sha }}`
            
            ---
            
            ### 📦 Instaladores Disponibles:
            
            #### 🪟 Windows
            - **MSI Installer**: `baucher-match-windows-*.msi`
            - **NSIS Installer**: `baucher-match-windows-*.exe`
            
            ---
            
            ### ✅ Características
            
            - ✅ **No requiere Python** - Runtime embebido
            - ✅ **No requiere dependencias** - Todo incluido
            - ✅ **Backend FastAPI** empaquetado
            - ✅ **Base de datos SQLite** integrada
            - ✅ **Procesamiento de PDFs** con PyMuPDF y pdftotext
            
            ---
            
            ### 📝 Instalación
            
            **Windows:**
            1. Descargar el `.msi` o `.exe`
            2. Ejecutar el instalador
            3. Seguir el asistente
            
            ---
            
            ### 🐛 Reportar Issues
            
            Si encuentras algún problema, por favor abre un issue en el repositorio.
          draft: false
          prerelease: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
