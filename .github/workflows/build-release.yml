name: Build and Release Baucher Match

on:
  push:
    branches:
      - feature/empaquetado-fullstack
  pull_request:
    branches:
      - feature/empaquetado-fullstack
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

env:
  PYTHON_VERSION: '3.9'
  NODE_VERSION: '20'

jobs:
  build-macos:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies (Poppler)
        run: |
          brew install poppler

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requeriments.txt
          .venv/bin/pip install pyinstaller

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build backend
        run: npm run build:backend

      - name: Bundle system libraries
        run: npm run build:libs

      - name: Build Tauri app
        run: npm run tauri build

      - name: Rename artifacts
        run: |
          cd src-tauri/target/release/bundle/dmg
          for file in *.dmg; do
            mv "$file" "baucher-match-macos-$(uname -m)-${GITHUB_SHA::7}.dmg"
          done

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: baucher-match-macos-${{ runner.arch }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  build-ubuntu:
    name: Build Linux (Ubuntu)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpoppler-cpp-dev \
            libpoppler-glib-dev \
            poppler-utils

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requeriments.txt
          .venv/bin/pip install pyinstaller

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build backend
        run: npm run build:backend

      - name: Bundle system libraries
        run: npm run build:libs

      - name: Build Tauri app
        run: npm run tauri build

      - name: Rename artifacts
        run: |
          cd src-tauri/target/release/bundle/appimage
          for file in *.AppImage; do
            mv "$file" "baucher-match-linux-${GITHUB_SHA::7}.AppImage"
          done

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: baucher-match-linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: baucher-match-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Python virtual environment
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -r backend\requeriments.txt
          .venv\Scripts\pip install pyinstaller

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download and setup Poppler for Windows
        shell: powershell
        run: |
          # Descargar Poppler precompilado para Windows
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip"
          Invoke-WebRequest -Uri $url -OutFile poppler.zip
          Expand-Archive -Path poppler.zip -DestinationPath poppler
          
          # Crear directorio de librerías
          New-Item -ItemType Directory -Force -Path src-tauri\libs
          
          # Copiar todas las DLLs necesarias
          Copy-Item -Path "poppler\poppler-24.08.0\Library\bin\*.dll" -Destination "src-tauri\libs\" -Force
          
          # Verificar que las DLLs se copiaron
          Get-ChildItem src-tauri\libs\

      - name: Build backend
        run: npm run build:backend

      - name: Build Tauri app
        run: npm run tauri build

      - name: Rename artifacts
        shell: powershell
        run: |
          cd src-tauri\target\release\bundle\msi
          Get-ChildItem *.msi | Rename-Item -NewName { "baucher-match-windows-$($env:GITHUB_SHA.Substring(0,7)).msi" }

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: baucher-match-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baucher-match-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-macos, build-ubuntu, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.ref_name }} - ${{ github.sha }}
          body: |
            ## 🚀 Baucher Match - Build Automático
            
            ### Branch: `${{ github.ref_name }}`
            ### Commit: `${{ github.sha }}`
            
            ---
            
            ### 📦 Instaladores Disponibles:
            
            #### 🍎 macOS
            - **Apple Silicon (M1/M2/M3)**: `baucher-match-macos-arm64-*.dmg`
            - **Intel**: `baucher-match-macos-x86_64-*.dmg`
            
            #### 🐧 Linux
            - **AppImage** (universal): `baucher-match-linux-*.AppImage`
            - **Debian/Ubuntu**: `baucher-match-*.deb`
            
            #### 🪟 Windows
            - **MSI Installer**: `baucher-match-windows-*.msi`
            - **NSIS Installer**: `baucher-match-windows-*.exe`
            
            ---
            
            ### ✅ Características
            
            - ✅ **No requiere Python** - Runtime embebido
            - ✅ **No requiere dependencias** - Todo incluido
            - ✅ **Backend FastAPI** empaquetado
            - ✅ **Base de datos SQLite** integrada
            - ✅ **Procesamiento de PDFs** con PyMuPDF y pdftotext
            
            ---
            
            ### 📝 Instalación
            
            **macOS:**
            1. Descargar el `.dmg` apropiado para tu procesador
            2. Abrir el archivo
            3. Arrastrar a Aplicaciones
            4. Clic derecho → Abrir (primera vez)
            
            **Linux:**
            ```bash
            chmod +x baucher-match-linux-*.AppImage
            ./baucher-match-linux-*.AppImage
            ```
            
            **Windows:**
            1. Descargar el `.msi` o `.exe`
            2. Ejecutar el instalador
            3. Seguir el asistente
            
            ---
            
            ### 🐛 Reportar Issues
            
            Si encuentras algún problema, por favor abre un issue en el repositorio.
          draft: false
          prerelease: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
