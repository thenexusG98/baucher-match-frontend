name: Build and Release Baucher Match

on:
  push:
    branches:
      - feature/empaquetado-fullstack
  pull_request:
    branches:
      - feature/empaquetado-fullstack
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Download and setup Poppler for Windows
        shell: powershell
        run: |
          # Descargar Poppler precompilado para Windows
          Write-Host "=== Descargando Poppler ===" -ForegroundColor Cyan
          $url = "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.08.0-0/Release-24.08.0-0.zip"
          Invoke-WebRequest -Uri $url -OutFile poppler.zip
          Expand-Archive -Path poppler.zip -DestinationPath poppler
          
          # Crear directorio de librerías para Tauri
          New-Item -ItemType Directory -Force -Path src-tauri\libs | Out-Null
          
          # Copiar todas las DLLs necesarias
          Copy-Item -Path "poppler\poppler-24.08.0\Library\bin\*.dll" -Destination "src-tauri\libs\" -Force
          
          Write-Host "`n[OK] Poppler descargado y DLLs copiadas" -ForegroundColor Green

      - name: Setup Python virtual environment
        shell: powershell
        run: |
          python -m venv .venv
          $pythonVenv = ".venv\Scripts\python.exe"
          $pipVenv = ".venv\Scripts\pip.exe"
          
          Write-Host "=== Instalando dependencias Python ===" -ForegroundColor Cyan
          & $pythonVenv -m pip install --upgrade pip
          
          # Instalar requirements.txt sin pdftotext primero
          Write-Host "`nInstalando dependencias (excepto pdftotext)..." -ForegroundColor Yellow
          Get-Content backend\requirements.txt | Where-Object { 
              $_ -notmatch '^pdftotext' -and $_.Trim() -ne '' -and -not $_.StartsWith('#') 
          } | ForEach-Object {
              $package = $_.Trim()
              Write-Host "  - $package" -ForegroundColor Gray
              & $pipVenv install $package --quiet
          }
          
          # Intentar instalar pdftotext (opcional)
          Write-Host "`nIntentando instalar pdftotext..." -ForegroundColor Yellow
          $ErrorActionPreference = "SilentlyContinue"
          & $pipVenv install pdftotext 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "[OK] pdftotext instalado" -ForegroundColor Green
          } else {
              Write-Host "[WARNING] pdftotext no disponible - se usara PyMuPDF" -ForegroundColor Yellow
          }
          $ErrorActionPreference = "Continue"
          
          # Instalar PyInstaller
          Write-Host "`nInstalando PyInstaller..." -ForegroundColor Yellow
          & $pipVenv install pyinstaller
          
          # Verificar módulos críticos
          Write-Host "`n=== Verificando instalacion ===" -ForegroundColor Cyan
          $criticalModules = @('uvicorn', 'fastapi', 'pydantic', 'starlette')
          $allOk = $true
          foreach ($module in $criticalModules) {
              $result = & $pythonVenv -c "import $module; print('[OK] $module')" 2>&1
              if ($LASTEXITCODE -eq 0) {
                  Write-Host $result -ForegroundColor Green
              } else {
                  Write-Host "[ERROR] Falta modulo critico: $module" -ForegroundColor Red
                  Write-Host "Salida: $result" -ForegroundColor Yellow
                  $allOk = $false
              }
          }
          
          # Verificar pdftotext (opcional - continuar si falta)
          $ErrorActionPreference = "SilentlyContinue"
          $pdftotextResult = & $pythonVenv -c "import pdftotext; print('[OK] pdftotext')" 2>&1
          $pdftotextExitCode = $LASTEXITCODE
          $ErrorActionPreference = "Continue"
          
          if ($pdftotextExitCode -eq 0) {
              Write-Host $pdftotextResult -ForegroundColor Green
          } else {
              Write-Host "[WARNING] pdftotext no disponible - el backend usara PyMuPDF" -ForegroundColor Yellow
          }
          
          if (-not $allOk) {
              Write-Host "`n[ERROR] Faltan modulos criticos" -ForegroundColor Red
              exit 1
          }
          
          Write-Host "`n[OK] Entorno Python configurado correctamente" -ForegroundColor Green

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build backend
        shell: powershell
        run: |
          # Usar el path absoluto del Python del venv
          $pythonVenv = ".venv\Scripts\python.exe"
          $pipVenv = ".venv\Scripts\pip.exe"
          
          Write-Host "=== Compilando backend con PyInstaller ===" -ForegroundColor Cyan
          Write-Host "Python: $pythonVenv" -ForegroundColor Gray
          & $pythonVenv --version
          
          # Verificar PyInstaller
          & $pythonVenv -c "import PyInstaller; print(f'PyInstaller {PyInstaller.__version__}')"
          
          # Listar módulos instalados relevantes
          Write-Host "`nModulos instalados:" -ForegroundColor Yellow
          & $pipVenv list | Select-String -Pattern "fastapi|uvicorn|pydantic|starlette|pdftotext|pymupdf|pyinstaller"
          
          # Crear directorio de binarios
          New-Item -ItemType Directory -Force -Path "src-tauri\binaries" | Out-Null
          
          # Cambiar a directorio backend
          Set-Location backend
          
          Write-Host "`n=== Ejecutando PyInstaller ===" -ForegroundColor Cyan
          
          # Compilar usando PyInstaller del venv
          & ..\.venv\Scripts\pyinstaller.exe --clean --log-level INFO backend.spec 2>&1 | Tee-Object -FilePath "../pyinstaller-build.log"
          
          $pyinstallerExitCode = $LASTEXITCODE
          Write-Host "`nPyInstaller exit code: $pyinstallerExitCode" -ForegroundColor $(if ($pyinstallerExitCode -eq 0) { "Green" } else { "Red" })
          
          if ($pyinstallerExitCode -ne 0) {
              Write-Host "[ERROR] PyInstaller fallo" -ForegroundColor Red
              exit 1
          }
          
          Set-Location ..
          
          # Buscar el ejecutable generado
          Write-Host "`nBuscando ejecutable compilado..." -ForegroundColor Cyan
          $backendExe = $null
          $possibleNames = @(
              "backend\dist\backend-api.exe",
              "backend\dist\backend-api\backend-api.exe",
              "backend\dist\main\main.exe",
              "backend\dist\main.exe"
          )
          
          foreach ($path in $possibleNames) {
              Write-Host "Verificando: $path" -ForegroundColor Gray
              if (Test-Path $path) {
                  $backendExe = $path
                  Write-Host "[OK] Encontrado: $path" -ForegroundColor Green
                  $fileInfo = Get-Item $path
                  Write-Host "Tamano: $($fileInfo.Length) bytes" -ForegroundColor Yellow
                  break
              }
          }
          
          if (-not $backendExe) {
              Write-Host "`n[ERROR] No se encontro el ejecutable del backend" -ForegroundColor Red
              Write-Host "Estructura completa de backend\dist:" -ForegroundColor Yellow
              if (Test-Path "backend\dist") {
                  Get-ChildItem "backend\dist" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
              } else {
                  Write-Host "El directorio backend\dist no existe" -ForegroundColor Red
              }
              Write-Host "`nLog completo de PyInstaller:" -ForegroundColor Yellow
              if (Test-Path "pyinstaller-build.log") {
                  Get-Content "pyinstaller-build.log"
              }
              exit 1
          }
          
          # Copiar con ambos nombres
          Write-Host "`nCopiando binarios..." -ForegroundColor Cyan
          Copy-Item -Path $backendExe -Destination "src-tauri\binaries\backend-api-x86_64-pc-windows-msvc.exe" -Force
          Write-Host "[OK] Backend copiado a: backend-api-x86_64-pc-windows-msvc.exe" -ForegroundColor Green
          
          Copy-Item -Path $backendExe -Destination "src-tauri\binaries\backend-api.exe" -Force
          Write-Host "[OK] Backend copiado a: backend-api.exe" -ForegroundColor Green
          
          # IMPORTANTE: Copiar DLLs de Poppler junto al ejecutable del backend
          # Esto es necesario porque pdftotext necesita estas DLLs en el mismo directorio
          Write-Host "`nCopiando DLLs de Poppler junto al ejecutable del backend..." -ForegroundColor Cyan
          if (Test-Path "src-tauri\libs\*.dll") {
              Copy-Item -Path "src-tauri\libs\*.dll" -Destination "src-tauri\binaries\" -Force
              Write-Host "[OK] DLLs copiadas al directorio del backend" -ForegroundColor Green
              Write-Host "DLLs copiadas:" -ForegroundColor Yellow
              Get-ChildItem "src-tauri\binaries\*.dll" | Select-Object Name | Format-Table
          } else {
              Write-Host "[WARNING] No se encontraron DLLs en src-tauri\libs\" -ForegroundColor Yellow
          }
          
          # Verificar que los binarios existen
          Write-Host "`nVerificando binarios creados:" -ForegroundColor Cyan
          if (Test-Path "src-tauri\binaries\backend-api-x86_64-pc-windows-msvc.exe") {
              Write-Host "[OK] backend-api-x86_64-pc-windows-msvc.exe" -ForegroundColor Green
              Get-Item "src-tauri\binaries\backend-api-x86_64-pc-windows-msvc.exe" | Format-List Name, Length, LastWriteTime
          }
          if (Test-Path "src-tauri\binaries\backend-api.exe") {
              Write-Host "[OK] backend-api.exe" -ForegroundColor Green
              Get-Item "src-tauri\binaries\backend-api.exe" | Format-List Name, Length, LastWriteTime
          }
          
          # Listar todos los archivos en binaries
          Write-Host "`nContenido completo de src-tauri\binaries:" -ForegroundColor Cyan
          Get-ChildItem "src-tauri\binaries" -Recurse | Format-Table Name, Length, LastWriteTime

      - name: Verify binaries before Tauri build
        shell: powershell
        run: |
          Write-Host "=== VERIFICACION FINAL ANTES DEL BUILD DE TAURI ===" -ForegroundColor Magenta
          Write-Host "`nContenido de src-tauri\binaries" -ForegroundColor Cyan
          if (Test-Path "src-tauri\binaries") {
              Get-ChildItem "src-tauri\binaries" -Force | Format-Table Name, Length, LastWriteTime, FullName
              
              Write-Host "`nVerificando archivos especificos:" -ForegroundColor Yellow
              $files = @(
                  "src-tauri\binaries\backend-api.exe",
                  "src-tauri\binaries\backend-api-x86_64-pc-windows-msvc.exe"
              )
              
              $allFilesExist = $true
              foreach ($file in $files) {
                  if (Test-Path $file) {
                      $info = Get-Item $file
                      Write-Host "[OK] $($file): $($info.Length) bytes" -ForegroundColor Green
                  } else {
                      Write-Host "[ERROR] $($file): NO EXISTE" -ForegroundColor Red
                      $allFilesExist = $false
                  }
              }
              
              if (-not $allFilesExist) {
                  Write-Host "`n[ERROR] Faltan archivos binarios necesarios" -ForegroundColor Red
                  exit 1
              }
              
              Write-Host "`n[OK] Todos los binarios necesarios existen" -ForegroundColor Green
          } else {
              Write-Host "[ERROR] El directorio src-tauri\binaries NO EXISTE" -ForegroundColor Red
              exit 1
          }

      - name: Build Tauri app
        env:
          TAURI_BUNDLER_WIX_INCLUDE_BINARIES: "true"
        run: npm run tauri build -- --verbose

      - name: Verify Tauri bundle contents
        shell: powershell
        run: |
          Write-Host "=== VERIFICACION DEL BUNDLE DE TAURI ===" -ForegroundColor Magenta
          
          # Buscar el directorio de instalacion de la app
          $bundlePath = "src-tauri\target\release"
          
          Write-Host "`nContenido de $bundlePath" -ForegroundColor Cyan
          Get-ChildItem $bundlePath -Directory | Format-Table Name
          
          # Verificar si hay un directorio con los binarios externos
          if (Test-Path "$bundlePath\binaries") {
              Write-Host "`n[OK] Directorio binaries encontrado en release" -ForegroundColor Green
              Get-ChildItem "$bundlePath\binaries" -Recurse | Format-Table Name, Length
          } else {
              Write-Host "`n[WARNING] NO se encontro directorio binaries en release" -ForegroundColor Yellow
          }
          
          # Verificar el ejecutable principal
          if (Test-Path "$bundlePath\baucher-match-frontend.exe") {
              Write-Host "`n[OK] Ejecutable principal encontrado" -ForegroundColor Green
          }
          
          # Buscar archivos relacionados con backend en el bundle
          Write-Host "`nBuscando archivos de backend en el bundle" -ForegroundColor Cyan
          Get-ChildItem $bundlePath -Recurse -Include "*backend*" -ErrorAction SilentlyContinue | 
              Select-Object FullName, Length | Format-Table
          
          # Verificar el MSI generado
          $msiPath = "src-tauri\target\release\bundle\msi"
          if (Test-Path $msiPath) {
              Write-Host "`nArchivos MSI generados" -ForegroundColor Cyan
              Get-ChildItem $msiPath -Filter "*.msi" | Select-Object Name, Length, LastWriteTime | Format-Table
          }

      - name: Rename artifacts
        shell: powershell
        run: |
          cd src-tauri\target\release\bundle\msi
          Get-ChildItem *.msi | Rename-Item -NewName { "baucher-match-windows-$($env:GITHUB_SHA.Substring(0,7)).msi" }

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: baucher-match-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload Windows NSIS
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baucher-match-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.ref_name }} - ${{ github.sha }}
          body: |
            ## 🚀 Baucher Match - Build Automático
            
            ### Branch: `${{ github.ref_name }}`
            ### Commit: `${{ github.sha }}`
            
            ---
            
            ### 📦 Instaladores Disponibles:
            
            #### 🪟 Windows
            - **MSI Installer**: `baucher-match-windows-*.msi`
            - **NSIS Installer**: `baucher-match-windows-*.exe`
            
            ---
            
            ### ✅ Características
            
            - ✅ **No requiere Python** - Runtime embebido
            - ✅ **No requiere dependencias** - Todo incluido
            - ✅ **Backend FastAPI** empaquetado
            - ✅ **Base de datos SQLite** integrada
            - ✅ **Procesamiento de PDFs** con PyMuPDF y pdftotext
            
            ---
            
            ### 📝 Instalación
            
            **Windows:**
            1. Descargar el `.msi` o `.exe`
            2. Ejecutar el instalador
            3. Seguir el asistente
            
            ---
            
            ### 🐛 Reportar Issues
            
            Si encuentras algún problema, por favor abre un issue en el repositorio.
          draft: false
          prerelease: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
